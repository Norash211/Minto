services:
  postgres:
    image: postgres:16
    container_name: minto-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: minto
      POSTGRES_PASSWORD: minto_dev_password
      POSTGRES_DB: minto
    volumes:
      - minto_postgres_data:/var/lib/postgresql/data

volumes:
  minto_postgres_data: